name: Auto Sync Forex Calendar

on:
  schedule:
    - cron: '0 * * * *' # Chạy tự động 1 tiếng/lần
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Forex Factory JSON (This Week & Next Week)
        run: |
          # Tải file bằng curl kèm User-Agent trình duyệt để tránh bị Cloudflare chặn HTML
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o thisweek.json
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://nfs.faireconomy.media/ff_calendar_nextweek.json" -o nextweek.json

          # Ghép 2 file JSON thành 1 file data.json
          node -e '
          const fs = require("fs");
          try {
            const thisWeek = JSON.parse(fs.readFileSync("thisweek.json", "utf8"));
            let nextWeek = [];
            try {
              nextWeek = JSON.parse(fs.readFileSync("nextweek.json", "utf8"));
            } catch (err) {
              console.log("Không tải được tuần sau, gán mảng rỗng.");
            }
            fs.writeFileSync("data.json", JSON.stringify({ this_week: thisWeek, next_week: nextWeek }));
            console.log("Đã tổng hợp dữ liệu data.json thành công!");
          } catch (e) {
            console.error("Lỗi xử lý file JSON:", e);
            process.exit(1);
          }
          '

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update forex data (this week & next week)" && git push)
