name: Auto Sync Forex Calendar

on:
  schedule:
    - cron: '0 * * * *' # Chạy tự động 1 tiếng/lần
  workflow_dispatch: # Cho phép bấm chạy thủ công nút "Run workflow"

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download Forex Factory JSON
        run: |
          curl -s "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o data.json

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update forex data" && git push)
